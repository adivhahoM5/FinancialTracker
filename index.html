<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financial Tracker</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="wrapper">

        <!-- Sidebar -->
        <div class="nav">
            <img src="files/profile.png" class="photo"><br><br>

            <h2>Quick Actions</h2>
            <hr>

            <button>New Income</button>
            <button>New Expenses</button>
            <button>New Transfer</button>

            <h2>Navigation</h2>
            <hr>

            <a href="#dashboard">Dashboard</a>
            <a href="#accounts">Accounts</a>
            <a href="#categories">Categories</a>
            <a href="#incomes">Incomes</a>
            <a href="#expenses">Expenses</a>

        </div>


        <!-- Main Content -->
        <div class="display">

            <h3>Accounts</h3>

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Current Balance</th>
                        <th>Monthly Expenses</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>Capitec</td>
                        <td>Savings</td>
                        <td>R5,000.00</td>
                        <td>R1,006.00</td>
                    </tr>

                    <tr>
                        <td>FNB</td>
                        <td>Cheque</td>
                        <td>R8,500.00</td>
                        <td>R2,100.00</td>
                    </tr>

                    <tr>
                        <td>Standard Bank</td>
                        <td>Savings</td>
                        <td>R3,200.00</td>
                        <td>R850.00</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
